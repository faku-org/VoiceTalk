[project]
name = "voicetalk-voice"
version = "0.15.0"
description = "VoiceTalk voice sidecar: local STT (Fluid Speech Pro) + Silero VAD over WebSocket"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.54",
  "websockets>=13",
  "httpx>=0.27",
  "numpy>=1.26",
  "torch>=2.8",
  "transformers>=5.22",
  "silero-vad>=5.1",
  "fermion-research",
  "sherpa-onnx",
  "huggingface_hub",
]

[project.scripts]
voicetalk-voice = "voicetalk_voice.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voicetalk_voice"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

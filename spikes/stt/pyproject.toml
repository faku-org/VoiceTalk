[project]
name = "voicetalk-spike-stt"
version = "0.0.0"
description = "Spike: local Spanish STT (Fluid Speech Pro) on the user's own recordings"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.8",
  "transformers>=5.22",
  "soundfile>=0.13",
  "librosa>=0.10",
  "numpy>=1.26",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
package = false
